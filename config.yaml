# Treehouse (th) Module Configuration
# Agent-enabled workspaces for focused development
# Version: 2.0.0

# Core Configuration Values
bmad_folder: .bmad
user_name:
communication_language: English
document_output_language: English

# Base Workspace Configuration (set by treehouse-init)
# These define the source of truth for all workspace tracking
base_workspace_path: "/home/joao/Documents/amora-os"
base_branch: "main"

# Workspace tracking configuration
tracking_folder: ".bmad-tracking"

# Git Worktree Configuration
# Base directory where all nook worktrees are created
worktrees_folder: "/home/joao/Documents/amora-os-worktrees"

# Paths to sync between worktrees
# Synced TO base_workspace_path/.bmad-tracking/{branch}/ during nook-sync
# Restored FROM base_workspace_path/.bmad-tracking/{branch}/ during nook-restore
sync_paths:
  - docs
  - .bmad/_cfg
  - .bmad/bmm/config.yaml
  - .bmad/custom/src

# Gitignored paths (added to .gitignore during treehouse-init)
# Gitignoring here means you won't need to commit after sync/restore.
# Only .bmad-tracking/ submodule in base workspace requires commits.
# Remove paths from here if you prefer to commit them locally.
gitignore_paths:
  - docs
  - .bmad/custom/agents
  - .claude/commands/bmad/custom

# Auto-commit tracking changes after sync
# When true: nook-sync automatically commits submodule + parent pointer
# When false: user must manually commit (allows batching multiple syncs)
# Default: false
auto_commit_tracking: true
