# Treehouse (th) Module Configuration - Example/Backup
# Agent-enabled workspaces for focused development
# Version: 2.0.0
#
# NOTE: The main config.yaml gets rewritten by the installer.
# This .example.yaml file is a reference/backup that preserves your configuration.
# Copy values from here to config.yaml after reinstalling if needed.

# Core Configuration Values
bmad_folder: .bmad
user_name: User
communication_language: English
document_output_language: English

# Base Workspace Configuration (set by treehouse-init)
# These define the source of truth for all workspace tracking
# Leave empty - will be set automatically when you run treehouse-init
base_workspace_path: ""   # Absolute path to base worktree
base_branch: ""         # Branch name of base workspace

# Workspace tracking configuration
# Directory where branch context is archived (in base workspace only)
tracking_folder: ".bmad-tracking"

# Git Worktree Configuration
# Base directory where all nook worktrees are created
# Customize this path for your system
worktrees_folder: "/home/user/bmad-worktrees"

# Paths to sync between worktrees
# Synced TO base_workspace_path/.bmad-tracking/{branch}/ during nook-sync
# Restored FROM base_workspace_path/.bmad-tracking/{branch}/ during nook-restore
sync_paths:
  - .bmad/_cfg
  - .bmad/bmm/config.yaml
  - .bmad/custom/src
  - docs
  - bmad

# Gitignored paths (added to .gitignore during treehouse-init)
# Gitignoring here means you won't need to commit after sync/restore.
# Only .bmad-tracking/ submodule in base workspace requires commits.
# Remove paths from here if you prefer to commit them locally.
gitignore_paths:
  - .bmad/custom/agents
  - .claude/commands/bmad/custom
  - docs
  - bmad

# Skip-worktree paths (applied during nook-fork)
# Files marked skip-worktree won't show in git status when modified locally.
# Use for config files that need local customization per nook.
# Supports both file paths and folder patterns (folder/* applies to all files in folder)
skip_worktree_paths:
  - .bmad/_cfg
  - .bmad/bmm/config.yaml
  - .bmad/custom/src
  - bmad

# Auto-commit tracking changes after sync
# When true: nook-sync automatically commits submodule + parent pointer
# When false: user must manually commit (allows batching multiple syncs)
# Default: false
#
# With submodule architecture, committing tracking changes requires TWO commits:
# 1. Inside .bmad-tracking/ submodule (the actual file changes)
# 2. In parent repo (update submodule pointer)
#
# Set to true for convenience, false for more control over commit batching.
auto_commit_tracking: false

# TREEHOUSE WORKFLOWS
#
# Available commands:
#   /bmad:th:workflows:treehouse-init     - Initialize base workspace (run first!)
#   /bmad:th:workflows:nook-fork          - Create a new nook (starts clean)
#   /bmad:th:workflows:nook-sync          - Save context to base workspace tracking
#   /bmad:th:workflows:nook-restore       - Restore context from base workspace tracking
#   /bmad:th:workflows:treehouse-list     - View workspace lineage tree with cleanup options
#
# Architecture:
# - .bmad-tracking/ is a git submodule (initialized only in base workspace)
# - Nooks: submodule not initialized, placeholder removed via skip-worktree
# - gitignore_paths don't need commits after sync/restore
# - Only .bmad-tracking/ submodule in base workspace needs commits
# - Nooks start clean (gitignored files + submodule don't travel)
# - nook-sync copies TO base workspace tracking folder (optionally auto-commits)
# - nook-restore copies FROM base workspace tracking folder
