name: "treehouse-init"
description: "Initialize base workspace - sets up gitignore for sync artifacts, creates tracking folder, establishes source of truth for all nooks"
version: "2.0.0"

# Workflow metadata
module: th
category: setup

# Configuration references
config:
  module_config: ".bmad/th/config.yaml"

# Input parameters (none required - auto-detects)
inputs: {}

# Output
outputs:
  base_workspace_path: "Path to base workspace (set in config)"
  base_branch: "Branch name of base workspace"
  gitignore_updated: "Sync paths added to .gitignore"
  tracking_created: "Initial context.yaml created"
