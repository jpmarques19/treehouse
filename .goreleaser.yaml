# GoReleaser configuration for Treehouse CLI
# https://goreleaser.com/customization/

version: 2

project_name: th

before:
  hooks:
    - go mod tidy

builds:
  - id: th
    main: ./cmd/th
    binary: th
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/treehouse-cli/th/internal/cmd.Version={{.Version}}

archives:
  - format: binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^style:'
      - '^test:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: treehouse-cli
    name: th
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
